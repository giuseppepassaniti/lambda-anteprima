<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230E212E%22/%3E%3Ccircle%20cx%3D%2221%22%20cy%3D%2230%22%20r%3D%2210%22%20fill%3D%22none%22%20stroke%3D%22%23FFD66B%22%20stroke-width%3D%225%22/%3E%3Ccircle%20cx%3D%2243%22%20cy%3D%2230%22%20r%3D%2210%22%20fill%3D%22none%22%20stroke%3D%22%23FFD66B%22%20stroke-width%3D%225%22/%3E%3Cpath%20d%3D%22M29%2028q3-4%206%200%22%20fill%3D%22none%22%20stroke%3D%22%23FFD66B%22%20stroke-width%3D%224%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sede · Centro Studi Lambda</title>
<meta name="description" content="La sede Lambda: tutor in presenza e postazioni studio collegate alla Rete Lambda.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
/* =================== LAMBDA · template della singola sede =================== */
.soon-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;border:1px dashed currentColor;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.65}

/* ---------- HERO 3D ---------- */
.shero{position:relative;height:100svh;min-height:640px;overflow:hidden;background:#050d12}
#sCanvas{position:absolute;inset:0;width:100%;height:100%}
.shero .veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(5,13,18,.92) 0%,rgba(5,13,18,.6) 34%,transparent 62%),linear-gradient(0deg,rgba(5,13,18,.7),transparent 30%)}
.shero .wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding-top:var(--hdr)}
.crumb{display:flex;gap:10px;font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.crumb a:hover{color:#fff} .crumb b{color:var(--warm);font-weight:500}
.shero h1{margin-top:22px;max-width:12ch;font:700 clamp(46px,5.6vw,92px)/.94 var(--font);letter-spacing:-.05em}
.shero h1 em{font-style:normal;color:var(--warm)}
.shero .lead{margin-top:22px;max-width:44ch;font-size:clamp(17px,1.4vw,20px);line-height:1.5;color:rgba(255,255,255,.74)}
.shero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.facts span{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:14px;color:rgba(255,255,255,.8)}
.facts svg{width:16px;height:16px;fill:none;stroke:var(--warm);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.slabel{position:absolute;left:0;top:0;z-index:1;padding:8px 13px;border-radius:999px;background:rgba(8,22,31,.75);border:1px solid rgba(255,214,107,.6);font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--warm);white-space:nowrap;opacity:0;pointer-events:none}
.sfallback{display:none;position:absolute;right:6%;top:50%;width:min(36vw,420px);transform:translateY(-45%);opacity:.9}
body.nogl .sfallback{display:block} body.nogl #sCanvas,body.nogl .slabel{display:none}


/* ---------- TOUR 3D ---------- */
.tour{background:var(--deep);padding:clamp(100px,13vh,150px) 0 clamp(110px,14vh,160px)}
.tour .eyebrow{color:var(--warm)}
.tour .ttop{display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap}
.tbox{position:relative;margin-top:40px;height:min(74vh,700px);min-height:440px;border-radius:32px;overflow:hidden;background:#dfe8ec;box-shadow:0 50px 100px -50px #000}
#tCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:pan-y}
#tCanvas:active{cursor:grabbing}
#tHot{position:absolute;inset:0;pointer-events:none}
.hs{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;padding:0;transition:opacity .35s}
.hs i{position:relative;width:22px;height:22px;border-radius:50%;background:var(--warm);box-shadow:0 0 0 6px rgba(255,214,107,.3),0 6px 16px rgba(14,33,46,.4)}
.hs i::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--warm);animation:hsr 1.8s ease-out infinite}
@keyframes hsr{from{transform:scale(.8);opacity:1}to{transform:scale(1.8);opacity:0}}
.hs span{padding:7px 11px;border-radius:999px;background:rgba(14,33,46,.85);color:#fff;font:700 13px/1 var(--font);white-space:nowrap;opacity:0;transform:translateX(-6px);transition:opacity .3s,transform .3s var(--ease)}
.hs:hover span,.hs:focus-visible span{opacity:1;transform:none}
.tpanel{position:absolute;left:20px;bottom:20px;width:min(400px,calc(100% - 40px));padding:22px 24px;border-radius:24px;background:rgba(8,22,31,.86);color:#fff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tpanel.swap>*{animation:tin .6s var(--ease) both}
.tpanel.swap>*:nth-child(2){animation-delay:.05s} .tpanel.swap>*:nth-child(3){animation-delay:.1s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.tpanel .k{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--warm)}
.tpanel h3{margin-top:10px;font:700 clamp(22px,2vw,28px)/1.1 var(--font);letter-spacing:-.03em}
.tpanel p{margin-top:8px;font-size:15px;line-height:1.45;color:rgba(255,255,255,.72)}
.tnav{display:flex;align-items:center;gap:12px;margin-top:18px}
.tnav button#tPrev{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);color:#fff;font-size:16px}
.tnav button#tPrev:disabled{opacity:.3}
.tnav #tNext{margin-left:auto;padding:12px 18px;border-radius:999px;background:var(--warm);color:var(--navy);font:700 14px/1 var(--font)}
#tDots{display:flex;gap:6px}
#tDots button{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .3s,transform .3s}
#tDots button[aria-current="true"]{background:var(--warm);transform:scale(1.3)}
.thint{position:absolute;right:20px;top:20px;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:rgba(14,33,46,.8);color:#fff;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;transition:opacity .5s;pointer-events:none}
.tbox.used .thint{opacity:0}
.tnote{position:absolute;right:20px;bottom:16px;font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(14,33,46,.5)}
.tlist{display:none;list-style:none;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px}
.tlist li{padding:22px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.tlist b{display:block;font-size:18px} .tlist span{display:block;margin-top:6px;font-size:14.5px;line-height:1.45;color:rgba(255,255,255,.7)}
body.nogl .tbox{display:none} body.nogl .tlist{display:grid}
@media (max-width: 760px){
  .tbox{height:78vh;min-height:520px;border-radius:24px}
  .tpanel{left:12px;right:12px;bottom:12px;width:auto;padding:18px}
  .thint{display:none} .tnote{top:14px;bottom:auto;right:14px}
  .tlist{grid-template-columns:1fr 1fr}
}

/* ---------- GALLERIA ---------- */
.gal{background:var(--light);color:var(--navy);padding:clamp(110px,14vh,160px) 0 clamp(120px,15vh,170px)}
.gal .eyebrow,.flow .eyebrow,.seat .eyebrow,.team .eyebrow,.visit .eyebrow{color:var(--teal)}
.ggrid{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:220px 220px;gap:12px;margin-top:44px}
.gtile{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(150deg,#d4e2e7,#c3d5dc)}
.gtile:first-child{grid-row:1/3}
.gtile img{width:100%;height:100%;object-fit:cover}
.gtile .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:var(--navy)}
.gtile .ph svg{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.gtile .ph b{position:relative;font-size:17px}
.gtile .ph small{position:relative;margin-top:4px;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#4a6370}

/* ---------- COME FUNZIONA IN SEDE ---------- */
.flow{background:#fff;color:var(--navy);padding:clamp(110px,14vh,160px) 0 clamp(120px,15vh,170px)}
.fsteps{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:56px;counter-reset:f}
.fsteps::before{content:"";position:absolute;left:4%;right:4%;top:28px;height:2px;background:linear-gradient(90deg,var(--aqua),var(--warm));transform-origin:left;transform:scaleX(var(--fl,0));transition:transform 1.6s var(--ease)}
.fsteps.in{--fl:1}
.fst{position:relative;text-align:center;padding:0 4px}
.fst .ic{position:relative;z-index:1;width:56px;height:56px;margin:0 auto;border-radius:50%;background:var(--navy);display:grid;place-items:center;box-shadow:0 0 0 6px #fff}
.fst .ic svg{width:26px;height:26px;fill:none;stroke:var(--warm);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fst.net .ic{background:var(--aqua)} .fst.net .ic svg{stroke:#fff}
.fst small{display:block;margin-top:18px;font:500 11px/1 var(--mono);letter-spacing:.14em;color:var(--aqua)}
.fst b{display:block;margin-top:8px;font-size:17px;line-height:1.2}
.fst p{margin-top:6px;font-size:14px;line-height:1.4;color:#4a6370}

/* ---------- POSTAZIONI ---------- */
.seat{background:var(--light);color:var(--navy);padding:clamp(110px,14vh,160px) 0 clamp(120px,15vh,170px)}
.seat .grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,80px);align-items:center}
.feat{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}
.feat li{padding:16px 18px;border-radius:18px;background:#fff;box-shadow:0 14px 30px -24px rgba(14,33,46,.4)}
.feat b{display:block;font-size:16px} .feat span{display:block;margin-top:4px;font-size:14px;line-height:1.4;color:#4a6370}
.isoS svg{width:100%;height:auto}

/* ---------- COLLEGATA A TUTTA LAMBDA ---------- */
.link{background:var(--deep);padding:clamp(110px,14vh,160px) 0 clamp(120px,15vh,170px)}
.link .eyebrow{color:var(--warm)}
.link .top{display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap}
.netd{margin-top:40px}
.netd svg{width:100%;height:auto;max-height:440px}
.netd .flowl{fill:none;stroke-width:2;stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.netd text{font-family:var(--font);font-weight:700}

/* ---------- TUTOR + RECENSIONI ---------- */
.team{background:#fff;color:var(--navy);padding:clamp(110px,14vh,160px) 0 clamp(120px,15vh,170px)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr) 1.2fr;gap:12px;margin-top:44px}
.tc{border-radius:24px;padding:22px;background:var(--light);display:flex;flex-direction:column;gap:14px;min-height:260px}
.tc .ph{flex:1;border-radius:18px;background:linear-gradient(160deg,#cddde3,#b7cdd5);display:grid;place-items:end center;overflow:hidden}
.tc .ph svg{width:70%}
.tc b{font-size:17px} .tc small{display:block;margin-top:2px;font-size:13px;color:#4a6370}
.tp{border-radius:24px;padding:26px;background:var(--navy);color:#fff;display:flex;flex-direction:column}
.tp .big{font:700 64px/1 var(--font);letter-spacing:-.04em}
.tp p{margin-top:12px;font-size:15px;line-height:1.45;color:rgba(255,255,255,.7)}
.tp a{margin-top:auto;padding-top:18px;font-weight:700;color:var(--warm)}

/* ---------- ORARI, MAPPA, PRENOTA ---------- */
.visit{background:var(--light);color:var(--navy);padding:clamp(110px,14vh,160px) 0 clamp(120px,15vh,170px)}
.vgrid{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px;margin-top:44px;align-items:stretch}
.vc{border-radius:24px;padding:24px;background:#fff;box-shadow:0 20px 40px -34px rgba(14,33,46,.5)}
.vc h3{font:500 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.hours{list-style:none;margin-top:16px;display:grid;gap:10px}
.hours li{display:flex;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid rgba(14,33,46,.08);font-size:15px}
.hours li b{font-weight:700}
.gmap{display:block;width:100%;height:190px;margin-top:12px;border:0;border-radius:14px;background:#e5eff2}
.nomap{display:grid;place-content:center;text-align:center;background:radial-gradient(circle at 50% 45%,rgba(0,148,158,.18),#e5eff2 60%)}
.nomap span{font:700 24px/1 var(--font)} .nomap small{margin-top:6px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#6b7f88}
.contacts{display:grid;gap:8px;margin-top:16px}
.ct{display:block;padding:12px 14px;border-radius:14px;background:var(--light);font-size:14.5px;color:var(--navy);word-break:break-word}
.ct b{display:block;font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.mapc .addr{margin-top:6px;font-size:15px;line-height:1.4}
.mapc>a{display:inline-block;margin-top:10px;font-weight:700;color:var(--teal);border-bottom:1.5px solid currentColor}
.vform{display:grid;gap:10px;margin-top:16px}
.vform input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid rgba(14,33,46,.14);font:500 16px/1 var(--font);color:var(--navy);background:#fff;outline:none;transition:border-color .3s}
.vform input:focus{border-color:var(--aqua)}
.vopts{display:flex;flex-wrap:wrap;gap:6px}
.vopt{padding:10px 12px;border-radius:12px;border:1.5px solid rgba(14,33,46,.14);font:700 14px/1 var(--font);color:var(--navy);transition:background .25s,border-color .25s,color .25s}
.vopt[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.vform .lbl{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#6b7f88;margin-top:4px}
.vchk{display:flex;gap:10px;font-size:13px;line-height:1.4;color:#4a6370}
.vchk input{width:18px;height:18px;flex-shrink:0;accent-color:var(--aqua)}
.vform .btn[disabled]{opacity:.4;pointer-events:none}
.vok{display:none;text-align:center;padding:30px 10px}
.vok b{display:block;font-size:24px;margin-top:10px} .vok p{margin-top:8px;color:#4a6370;line-height:1.5}
.vc.sent .vform{display:none} .vc.sent .vok{display:block}
.alt{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;border-radius:22px;background:var(--navy);color:#fff}
.alt p{font-weight:700;font-size:17px} .alt p span{display:block;font-weight:500;font-size:14px;color:rgba(255,255,255,.65);margin-top:4px}

/* ---------- ALTRE SEDI ---------- */
.others{background:radial-gradient(ellipse 70% 60% at 50% 45%, #16475a 0%, var(--navy) 55%, var(--deep) 100%);padding:clamp(100px,13vh,150px) 0}
.others h2{font:700 clamp(34px,4vw,60px)/1 var(--font);letter-spacing:-.045em;text-align:center}
.others h2 em{font-style:normal;color:var(--warm)}
.olist{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px}
.ol{padding:22px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);transition:transform .4s var(--ease),background .3s}
.ol:hover{transform:translateY(-4px);background:rgba(255,255,255,.09)}
.ol small{font:500 11px/1 var(--mono);letter-spacing:.14em;color:var(--warm);text-transform:uppercase}
.ol b{display:block;margin-top:8px;font-size:22px} .ol span{display:block;margin-top:14px;font-weight:700;font-size:14px;color:var(--warm)}

@media (max-width: 1100px){ .fsteps{grid-template-columns:repeat(3,1fr);row-gap:34px} .fsteps::before{display:none} .tgrid{grid-template-columns:1fr 1fr} .vgrid{grid-template-columns:1fr 1fr} .vgrid .vc:last-child{grid-column:1/3} }
@media (max-width: 860px){
  .shero .veil{background:linear-gradient(0deg,rgba(5,13,18,.95) 0%,rgba(5,13,18,.7) 45%,rgba(5,13,18,.1) 75%)}
  .shero .wrap{justify-content:flex-end;padding-bottom:50px}
  .sfallback{right:50%;top:22%;transform:translate(50%,0);width:60vw}
  .slabel{display:none}
  .ggrid{grid-template-columns:1fr 1fr;grid-template-rows:200px 160px 160px} .gtile:first-child{grid-column:1/3;grid-row:auto}
  .seat .grid{grid-template-columns:1fr} .olist{grid-template-columns:1fr 1fr}
}
@media (max-width: 600px){ .fsteps{grid-template-columns:1fr 1fr} .feat{grid-template-columns:1fr} .tgrid,.vgrid{grid-template-columns:1fr} .vgrid .vc:last-child{grid-column:auto} .shero .ctas .btn{width:100%;justify-content:center} }

/* =================== veste CMA (sede.html?c=...&b=cma) =================== */
body[data-branch="conc"]{--warm:#CD141F;--aqua:#a9b97a;--teal:#a9b97a;--navy:#0b0c0a;--deep:#060805;--light:#141a11;background:#060805}
body[data-branch="conc"] .shero{background:#060805}
body[data-branch="conc"] .shero .veil{background:linear-gradient(90deg,rgba(6,8,5,.92) 0%,rgba(6,8,5,.6) 34%,transparent 62%),linear-gradient(0deg,rgba(6,8,5,.7),transparent 30%)}
body[data-branch="conc"] .slabel{background:rgba(12,17,10,.8);border-color:rgba(205,20,31,.7);color:#ff8a92}
body[data-branch="conc"] .tour .eyebrow,body[data-branch="conc"] .link .eyebrow{color:#a9b97a}
body[data-branch="conc"] .tbox{background:#d9ddd3}
body[data-branch="conc"] .tpanel,body[data-branch="conc"] .thint{background:rgba(12,17,10,.88)}
body[data-branch="conc"] .tnav #tNext,body[data-branch="conc"] .vopt[aria-pressed="true"]{color:#fff}
body[data-branch="conc"] .hs i{box-shadow:0 0 0 6px rgba(205,20,31,.3),0 6px 16px rgba(0,0,0,.4)}
body[data-branch="conc"] .hs span{background:rgba(12,17,10,.9)}
body[data-branch="conc"] :is(.gal,.flow,.seat,.team,.visit){background:#0b0c0a;color:#F2F1EC}
body[data-branch="conc"] :is(.flow,.team){background:linear-gradient(#0b0c0a,#10160d)}
body[data-branch="conc"] .gtile{background:linear-gradient(150deg,#1d2718,#11160e);border:1px solid rgba(169,185,122,.18)}
body[data-branch="conc"] .gtile .ph{color:#F2F1EC}
body[data-branch="conc"] :is(.gtile .ph small,.fst p,.feat span,.tc small,.vok p,.vchk,.vform .lbl){color:rgba(242,241,236,.6)}
body[data-branch="conc"] .fst .ic{background:#1d2718;box-shadow:0 0 0 6px #0b0c0a}
body[data-branch="conc"] .fst.net .ic{background:#4B5A2B}
body[data-branch="conc"] :is(.feat li,.vc,.tc){background:linear-gradient(165deg,rgba(242,241,236,.07),rgba(242,241,236,.02));border:1px solid rgba(169,185,122,.2);box-shadow:none}
body[data-branch="conc"] .tc .ph{background:linear-gradient(160deg,#26331f,#151c11)}
body[data-branch="conc"] .tp,body[data-branch="conc"] .alt{background:linear-gradient(160deg,rgba(205,20,31,.22),#11160e);border:1px solid rgba(205,20,31,.5)}
body[data-branch="conc"] .hours li{border-color:rgba(169,185,122,.15)}
body[data-branch="conc"] .gmap{background:#141a11}
body[data-branch="conc"] .nomap{background:radial-gradient(circle at 50% 45%,rgba(169,185,122,.18),#141a11 60%)}
body[data-branch="conc"] .ct{background:rgba(242,241,236,.06);color:#F2F1EC}
body[data-branch="conc"] .vform input{background:rgba(242,241,236,.05);border-color:rgba(169,185,122,.25);color:#F2F1EC}
body[data-branch="conc"] .vopt{border-color:rgba(169,185,122,.25);color:#F2F1EC}
body[data-branch="conc"] .vopt[aria-pressed="true"]{background:#CD141F;border-color:#CD141F}
body[data-branch="conc"] .others{background:radial-gradient(ellipse 60% 60% at 50% 50%,#22301d 0%,#121710 55%,#060805 100%)}
body[data-branch="conc"] .sec-title em{color:#CD141F}

/* ---------- galleria con le foto reali: stessa palette del sito ---------- */
.ggrid.is-real{grid-template-columns:1.05fr 1fr 1fr 1fr;grid-template-rows:260px 260px}
.ggrid.is-real .gtile:first-child{grid-row:1/3}
.ggrid.is-real .gtile:last-child{grid-column:3/5}
.ggrid.is-real.n4{grid-template-columns:1.1fr 1fr 1fr} .ggrid.is-real.n4 .gtile:last-child{grid-column:2/4}
.gtile.real{display:block;padding:0;border:0;cursor:pointer;background:var(--navy);box-shadow:0 24px 50px -32px rgba(14,33,46,.6);isolation:isolate}
.gtile.real img{transition:transform 1.1s var(--ease),filter .6s;filter:saturate(.9) contrast(1.04) brightness(1.01)}
.gtile.real::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(140deg,rgba(0,148,158,.22),rgba(255,214,107,.12));mix-blend-mode:soft-light}
.gtile.real::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(14,33,46,0) 42%,rgba(14,33,46,.78) 100%)}
.gcap{position:absolute;left:14px;right:14px;bottom:14px;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;color:#fff}
.gcap small{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--warm)}
.gcap b{font:700 clamp(17px,1.4vw,21px)/1.1 var(--font);letter-spacing:-.02em}
.gcap em{font-style:normal;font-weight:700;font-size:13px;color:rgba(255,255,255,.85);max-height:0;opacity:0;overflow:hidden;transition:max-height .4s var(--ease),opacity .4s}
.gtile.real:hover img,.gtile.real:focus-visible img{transform:scale(1.05);filter:saturate(1) contrast(1.05)}
.gtile.real:hover .gcap em,.gtile.real:focus-visible .gcap em{max-height:20px;opacity:1}
@media (max-width: 860px){ .ggrid.is-real{grid-template-columns:1fr 1fr;grid-template-rows:340px 180px 180px 180px} .ggrid.is-real .gtile:first-child{grid-column:1/3;grid-row:auto} .ggrid.is-real .gtile:last-child{grid-column:1/3} .gcap em{max-height:20px;opacity:1} .ggrid.is-real.n4{grid-template-columns:1fr 1fr;grid-template-rows:380px 260px 220px} .ggrid.is-real.n4 .gtile:last-child{grid-column:1/3} }

<script>
gsap.set('#logo', { autoAlpha: 1 });
(() => {
  const $ = (s) => document.querySelector(s);
  if (!$('#vform')) return;
  // la linea del percorso si disegna quando entra in vista
  new IntersectionObserver((e, o) => e.forEach((x) => { if (x.isIntersecting) { x.target.classList.add('in'); o.disconnect(); } }), { threshold: 0.4 }).observe($('.fsteps'));
  // prenota una visita (prototipo: nessun dato viene inviato)
  const pick = (id) => $(id).addEventListener('click', (e) => { const b = e.target.closest('.vopt'); if (!b) return; b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); check(); });
  const check = () => { $('#vSend').disabled = !($('#vName').value.trim() && $('#vTel').value.replace(/\D/g, '').length >= 8 && $('#vOk').checked); };
  pick('#vWhy'); pick('#vWhen');
  $('#vform').addEventListener('input', check); $('#vform').addEventListener('change', check);
  document.querySelectorAll('.gtile.real').forEach((t) => t.addEventListener('click', () => {
    const go = () => window.__tourGo?.(+t.dataset.stop);
    const tour = document.getElementById('tour'); if (!tour) return;
    window.Lambda?.lenis ? window.Lambda.lenis.scrollTo(tour, { offset: -40, duration: 1.2, onComplete: go }) : (tour.scrollIntoView({ behavior: 'smooth' }), setTimeout(go, 700));
  }));
  $('#vform').addEventListener('submit', (e) => { e.preventDefault(); if ($('#vSend').disabled) return; /* TODO: collegare al CRM della sede */ $('#vcard').classList.add('sent'); });
})();
</script>
