<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concorsi · Concorsi Militari Academy</title>
<meta name="description" content="Concorsi, requisiti, prove e percorso di preparazione con Concorsi Militari Academy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/lambda.css?v=34">
<style>
/* =================== CMA · template della pagina di un corpo =================== */
body{background:var(--ink)}
:root{--cma-red:#CD141F;--hud:#a9b97a;--cc:#CD141F}
.k{font:500 12px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--hud)}
.h2{margin-top:14px;font:700 clamp(32px,3.8vw,58px)/1 var(--font);letter-spacing:-.045em;color:var(--bone)}
.h2 em{font-style:normal;color:var(--cma-red)}
.btn-red{background:var(--cma-red);color:#fff}
.btn-red:hover{box-shadow:0 14px 40px -10px rgba(205,20,31,.7)}
.btn-line{border:1.5px solid rgba(218,219,218,.35);color:var(--bone)}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 4px)}

/* ---------- HERO ---------- */
.ghero{position:relative;min-height:92svh;overflow:hidden;display:grid;align-items:center;background:radial-gradient(ellipse 60% 70% at 72% 50%, color-mix(in srgb,var(--cc) 22%, #121710) 0%, #121710 50%, var(--ink) 100%)}
.ghero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,4vw,70px);align-items:center;padding-top:calc(var(--hdr) + 40px);padding-bottom:70px}
.crumb{display:flex;gap:10px;font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(242,241,236,.5)}
.crumb a:hover{color:#fff} .crumb b{color:var(--cma-red);font-weight:500}
.ghero .def{margin-top:22px;display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;border:1px solid rgba(169,185,122,.3);font:500 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--hud)}
.ghero .def i{width:8px;height:8px;border-radius:2px;background:var(--cc);transform:rotate(45deg)}
.ghero h1{margin-top:16px;font:700 clamp(48px,6vw,104px)/.92 var(--font);letter-spacing:-.055em;color:var(--bone)}
.ghero .tag{margin-top:10px;font:700 clamp(20px,2vw,28px)/1.1 var(--font);letter-spacing:-.02em;color:var(--cc)}
.ghero .lead{margin-top:18px;max-width:46ch;font-size:clamp(16px,1.35vw,19px);line-height:1.5;color:rgba(242,241,236,.72)}
.ghero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.ghero .chips span{padding:9px 13px;border-radius:999px;border:1px solid rgba(169,185,122,.3);font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(242,241,236,.8)}
.ghero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.gpatch{position:relative;justify-self:center;width:min(100%,460px);aspect-ratio:.86;display:grid;place-items:center}
.gpatch .sold{position:absolute;inset:0}
.gpatch .rings{position:absolute;inset:8% 0 auto;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,transparent 39.6%,rgba(169,185,122,.18) 40%,transparent 40.4%),radial-gradient(circle,transparent 59.6%,rgba(169,185,122,.12) 60%,transparent 60.4%),radial-gradient(circle,transparent 79.6%,rgba(169,185,122,.08) 80%,transparent 80.4%)}
.gpatch .rings::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 82%,rgba(169,185,122,.28) 100%);animation:sweep 6s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}

.ctabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.ctabs button{padding:11px 14px;border-radius:12px;border:1.5px solid rgba(169,185,122,.25);font:700 14px/1.1 var(--font);color:rgba(242,241,236,.8);text-align:left;transition:background .3s,border-color .3s,color .3s}
.ctabs button[aria-selected="true"]{background:var(--bone);border-color:var(--bone);color:#121710}

/* ---------- SCHEDA DEL CONCORSO ---------- */
.sheetc{background:var(--ink);padding:clamp(90px,12vh,140px) 0}
.ctitle{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px}
.ctitle h2{font:700 clamp(32px,3.6vw,54px)/1 var(--font);letter-spacing:-.045em;color:var(--bone)}
.ctitle p{max-width:56ch;margin-top:12px;font-size:16.5px;line-height:1.55;color:rgba(242,241,236,.72)}
.lvlb{padding:8px 12px;border-radius:999px;background:rgba(205,20,31,.14);border:1px solid rgba(205,20,31,.45);font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#f3c9cc}
.reqs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:34px}
.rq{padding:18px;border-radius:18px;background:linear-gradient(170deg,rgba(242,241,236,.06),rgba(242,241,236,.02));border:1px solid rgba(169,185,122,.2)}
.rq small{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--hud)}
.rq small svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rq b{display:block;margin-top:12px;font:700 17px/1.25 var(--font);color:var(--bone)}
.rq span{display:block;margin-top:6px;font-size:13.5px;line-height:1.4;color:rgba(242,241,236,.6)}
.rq.wide{grid-column:span 2}
.route{position:relative;margin-top:44px}
.route h3{font:700 clamp(22px,2vw,28px)/1.1 var(--font);letter-spacing:-.03em;color:var(--bone)}
.steps{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:10px;margin-top:22px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.steps::before{content:"";position:absolute;left:20px;right:20px;top:21px;height:2px;background:linear-gradient(90deg,var(--cma-red),rgba(169,185,122,.3))}
.stp{position:relative;padding-top:52px}
.stp i{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#121710;border:2px solid var(--cma-red);font:700 14px/1 'Space Mono',var(--mono);font-style:normal;color:var(--bone)}
.stp b{display:block;font:700 15.5px/1.25 var(--font);color:var(--bone);padding-right:10px}
.stp span{display:block;margin-top:6px;font-size:13px;line-height:1.4;color:rgba(242,241,236,.6);padding-right:10px}
.warn{display:flex;gap:14px;align-items:flex-start;margin-top:30px;padding:18px 20px;border-radius:16px;background:rgba(205,20,31,.08);border:1px solid rgba(205,20,31,.35);font-size:15px;line-height:1.5;color:#f3d6d8}
.warn b{flex-shrink:0;font:700 12px/1.6 'Space Mono',var(--mono);letter-spacing:.12em;color:var(--cma-red)}
.disc{margin-top:22px;font-size:13px;line-height:1.5;color:rgba(242,241,236,.45)}
.disc a{color:var(--hud)}

/* ---------- FASCICOLO TECNICO (approfondimento dalla Libretta) ---------- */
.fasc{margin-top:48px}
.fasc-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.fasc-hd h3{font:700 clamp(22px,2vw,28px)/1.1 var(--font);letter-spacing:-.03em;color:var(--bone)}
.fasc-hd p{margin-top:8px;font-size:14px;line-height:1.45;color:rgba(242,241,236,.55);max-width:56ch}
.fasc-hd small{font:500 10.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cma-red)}
.ftabs{display:flex;gap:4px;margin-top:22px;overflow-x:auto;scrollbar-width:none;padding-left:14px}
.ftabs::-webkit-scrollbar{display:none}
.ftabs button{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:13px 18px 12px;border:1px solid rgba(169,185,122,.22);border-bottom:0;border-radius:12px 12px 0 0;background:rgba(242,241,236,.03);color:rgba(242,241,236,.55);font:600 14px/1 var(--font);cursor:pointer;transition:background .25s,color .25s}
.ftabs button i{font:700 11px/1 'Space Mono',var(--mono);font-style:normal;color:var(--hud);opacity:.7}
.ftabs button:hover{color:var(--bone)}
.ftabs button[aria-selected="true"]{background:#1a2216;color:var(--bone);border-color:rgba(169,185,122,.4)}
.ftabs button[aria-selected="true"] i{color:var(--cma-red);opacity:1}
.fpanel{position:relative;padding:clamp(22px,3vw,38px);border-radius:0 20px 20px 20px;background:linear-gradient(175deg,#1a2216,#10140d 70%);border:1px solid rgba(169,185,122,.4);overflow:hidden}
.fpanel::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(242,241,236,.018) 0 1px,transparent 1px 28px);pointer-events:none}
.fpanel .stamp{position:absolute;right:22px;top:18px;padding:5px 10px;border:1.5px solid rgba(205,20,31,.6);border-radius:6px;font:700 10.5px/1 'Space Mono',var(--mono);letter-spacing:.14em;color:rgba(205,20,31,.85);transform:rotate(4deg)}
.fbody{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:6px 48px;align-items:start;max-height:540px;overflow:hidden}
.fblk{min-width:0}
.fbody.open{max-height:none}
.fbody:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,#10140d)}
.fbody h5{margin:18px 0 10px;padding-top:14px;border-top:1px dashed rgba(169,185,122,.3);font:700 12px/1.3 'Space Mono',var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--hud)}
.fblk:nth-child(-n+2)>h5:first-child{margin-top:0;padding-top:0;border-top:0}
.fblk>p.lb:first-child{margin-top:0}
.fbody p{margin:0 0 10px;font-size:14.5px;line-height:1.55;color:rgba(242,241,236,.75)}
.fbody p.lb{margin-top:14px;font-weight:700;color:var(--bone)}
.fbody p.nb{padding:12px 14px;border-left:3px solid var(--cma-red);border-radius:0 10px 10px 0;background:rgba(205,20,31,.08);color:#f3d6d8;font-size:14px}
.fbody ul{margin:0 0 12px;padding:0;list-style:none}
.fbody li{position:relative;padding:4px 0 4px 20px;font-size:14.5px;line-height:1.5;color:rgba(242,241,236,.78)}
.fblk>ul>li::before{content:"";position:absolute;left:2px;top:12px;width:8px;height:8px;border:1.5px solid var(--hud);transform:rotate(45deg)}
.fbody li ul{margin:4px 0 2px}
.fbody li li{padding-left:16px;font-size:13.5px;color:rgba(242,241,236,.6)}
.fbody li li::before{content:"";position:absolute;left:2px;top:13px;width:7px;height:1.5px;background:rgba(169,185,122,.6)}
.fbody p.tbl{display:inline-flex;align-items:center;gap:8px;margin:2px 0 14px;padding:8px 12px;border:1px dashed rgba(169,185,122,.4);border-radius:8px;font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(169,185,122,.85)}
.fbody p.tbl::before{content:"";width:12px;height:9px;border:1.5px solid currentColor;border-radius:2px;background:linear-gradient(currentColor,currentColor) 0 3px/100% 1.5px no-repeat}
.fmore{position:relative;display:flex;align-items:center;gap:10px;margin:18px auto 0;padding:12px 20px;border-radius:999px;border:1px solid rgba(169,185,122,.35);background:transparent;color:var(--bone);font:600 14px/1 var(--font);cursor:pointer}
.fmore:hover{border-color:var(--hud)}
.fmore[hidden]{display:none}
@media(max-width:700px){.ftabs button{padding:11px 13px 10px;font-size:13px}.fpanel .stamp{display:none}.fbody{max-height:440px}}

/* ---------- NUMERI DELL'AZIENDA ---------- */
.gnums{position:relative;z-index:3;background:#0d100b;border-top:1px solid rgba(169,185,122,.14);border-bottom:1px solid rgba(169,185,122,.14);padding:clamp(34px,5vh,54px) 0}
.gnums .row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.gnums .n b{display:block;font:700 clamp(34px,3.4vw,52px)/1 'Space Mono',var(--mono);letter-spacing:-.03em;color:var(--bone)} .gnums .n b small{font-size:.45em;color:rgba(242,241,236,.5)}
.gnums .n > span{display:block;margin-top:8px;font-size:13.5px;line-height:1.35;color:rgba(242,241,236,.6);max-width:22ch}
.gnums .n:nth-child(3) b{color:var(--cma-red)}

/* ---------- SCHEDA: scelta del concorso + dossier del corpo ---------- */
.sheetc .top{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.sheetc .top .lead{max-width:44ch;font-size:clamp(16px,1.3vw,19px);line-height:1.5;color:rgba(242,241,236,.7)}
.pick{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px 22px}
.pick .grp{display:flex;flex-direction:column;gap:8px}
.pick .grp small{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(242,241,236,.45)}
.pick .grp div{display:flex;flex-wrap:wrap;gap:8px}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:clamp(22px,3vw,44px);margin-top:40px;align-items:start}
.sgrid .reqs{grid-template-columns:repeat(2,1fr)}
.dos{position:sticky;top:calc(var(--hdr) + 20px);border-radius:26px;background:linear-gradient(170deg,#18200f,#0d110a);border:1px solid color-mix(in srgb,var(--cc) 45%,rgba(169,185,122,.25));overflow:hidden}
.dos .dv{position:relative;height:300px;background:radial-gradient(circle at 50% 72%,color-mix(in srgb,var(--cc) 30%,transparent),transparent 62%),repeating-linear-gradient(0deg,rgba(169,185,122,.05) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(169,185,122,.05) 0 1px,transparent 1px 22px)}
.dos .dv small{position:absolute;left:16px;top:16px;font:700 11px/1 'Space Mono',var(--mono);letter-spacing:.14em;color:var(--cc)}
.dos .dv em{position:absolute;right:16px;top:14px;font:500 9.5px/1 var(--mono);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,241,236,.5);display:flex;align-items:center;gap:6px} .dos .dv em i{width:6px;height:6px;border-radius:50%;background:var(--cma-red);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2}}
.dtabs2{display:flex;border-top:1px solid rgba(169,185,122,.18);border-bottom:1px solid rgba(169,185,122,.18)}
.dtabs2 button{flex:1;padding:12px 6px;font:500 10.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(242,241,236,.55);border-right:1px solid rgba(169,185,122,.14);transition:background .3s,color .3s} .dtabs2 button:last-child{border-right:0}
.dtabs2 button[aria-selected="true"]{background:rgba(242,241,236,.06);color:var(--bone);box-shadow:inset 0 -2px 0 var(--cc)}
.dbody{padding:20px;min-height:220px}
.dbody p{font-size:14.5px;line-height:1.55;color:rgba(242,241,236,.75)}
.dbody .chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px} .dbody .chips2 span{padding:7px 10px;border-radius:8px;background:color-mix(in srgb,var(--cc) 16%,transparent);border:1px solid color-mix(in srgb,var(--cc) 40%,transparent);font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--bone)}
.dbody dl{display:grid;grid-template-columns:auto 1fr;gap:10px 14px} .dbody dt{font:500 10px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--hud)} .dbody dd{font-size:14px;line-height:1.45;color:var(--bone)}
.dbody .dfoot{margin-top:16px;font-size:12px;color:rgba(242,241,236,.45)}

/* ---------- METODO e SIMULATORE (semplici, rimandano alle pagine) ---------- */
.gband{background:#0d100b;padding:clamp(70px,9vh,110px) 0}
.gband.sim{background:linear-gradient(#0d100b,#10160d)}
.gband .wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,70px);align-items:center}
.gband .lead{margin-top:16px;max-width:46ch;font-size:clamp(16px,1.3vw,18px);line-height:1.5;color:rgba(242,241,236,.7)}
.gband .ctas{margin-top:24px}
.eagle5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.eagle5 div{padding:16px 10px;border-radius:16px;background:rgba(205,20,31,.08);border:1px solid rgba(205,20,31,.3);text-align:center}
.eagle5 b{display:block;font:700 clamp(30px,3vw,44px)/1 'Space Mono',var(--mono);color:var(--cma-red)} .eagle5 span{display:block;margin-top:8px;font-size:12px;line-height:1.3;color:rgba(242,241,236,.7)}
.simbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.simbox div{padding:18px 14px;border-radius:16px;border:1px solid rgba(169,185,122,.2);background:rgba(242,241,236,.03)} .simbox b{display:block;font:700 16px/1.2 var(--font);color:var(--bone)} .simbox span{display:block;margin-top:6px;font-size:13px;line-height:1.35;color:rgba(242,241,236,.6)} .simbox i{display:block;font:700 12px/1 'Space Mono',var(--mono);font-style:normal;color:var(--cma-red);margin-bottom:10px}

/* ---------- PERCORSI: preselettiva, psicoattitudinali, fisiche ---------- */
.gperc{background:var(--ink);padding:clamp(100px,13vh,150px) 0}
.gperc .top{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.gperc .top .lead{max-width:44ch;font-size:clamp(16px,1.3vw,19px);line-height:1.5;color:rgba(242,241,236,.7)}
.pblk{margin-top:56px}
.pblk .ph{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding-bottom:20px;border-bottom:1px solid rgba(169,185,122,.18)}
.pblk .ph .no{font:700 13px/1 'Space Mono',var(--mono);color:var(--cma-red);padding:10px 12px;border:1.5px solid rgba(205,20,31,.5);border-radius:10px}
.pblk .ph h3{font:700 clamp(24px,2.4vw,34px)/1.05 var(--font);letter-spacing:-.035em;color:var(--bone)}
.pblk .ph p{margin-top:8px;max-width:62ch;font-size:15.5px;line-height:1.5;color:rgba(242,241,236,.68)}
.pblk .feat{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px} .pblk .feat span{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid rgba(169,185,122,.28);font-size:13px;color:rgba(242,241,236,.85)} .pblk .feat span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--hud)}
.pcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px;align-items:stretch}
.pcards.n2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)} .pcards.n1{grid-template-columns:minmax(0,760px)}
.pc{position:relative;min-width:0;display:flex;flex-direction:column;padding:24px;border-radius:24px;background:linear-gradient(165deg,#161d10,#0d110a);border:1px solid rgba(169,185,122,.2)}
.pc.main{border-color:var(--cma-red);background:linear-gradient(165deg,rgba(205,20,31,.14),#0d110a 60%)}
.pc .pt{align-self:flex-start;padding:6px 10px;border-radius:8px;background:rgba(169,185,122,.12);font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--hud)} .pc.main .pt{background:var(--cma-red);color:#fff}
.pc h4{margin-top:14px;font:700 22px/1.12 var(--font);letter-spacing:-.025em;color:var(--bone)}
.pc .pr{margin-top:8px;font:700 15px/1.2 'Space Mono',var(--mono);color:var(--bone)} .pc .pr.ask{font:500 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(242,241,236,.5)}
.pc .plead{margin-top:12px;font-size:14.5px;line-height:1.5;color:rgba(242,241,236,.7)}
.pc ul{list-style:none;display:grid;gap:8px;margin-top:16px}

<script>
/* ---------- costruzione della pagina dai dati (prima del motore) ---------- */
(() => {
  const CORPI = window.CMA_CORPI, ALL = window.CMA_CONCORSI, key = document.body.dataset.corpo;
  const C = CORPI.find((c) => c.k === key);
  if (!C) { location.replace('concorsi.html#corpi-sec'); return; }
  document.documentElement.style.setProperty('--cc', C.color);
  document.title = `${C.n}: concorsi, requisiti e prove · Concorsi Militari Academy`;
  document.querySelector('meta[name="description"]').content = `${C.n}: i concorsi, i requisiti in breve, le fasi di selezione e come prepararsi con Concorsi Militari Academy e il Metodo EAGLE.`;
  // le Accademie raccolgono i concorsi da ufficiale e le scuole militari di tutti i corpi

  const P = window.CMA_PRODOTTI;
  /* spazio in alto uguale per tutte le card: qui andrà la motion graphic che spiega il prodotto */

  const media = (x) => x.cover ? '<div class="pmedia bcover" aria-hidden="true"><div class="bk"><i class="st"></i><small>Concorsi Militari Academy</small><b>La guida completa ai concorsi</b><span>Forze Armate e di Polizia</span></div></div>'

    return `<article class="pc${x.main ? ' main' : ''}${x.cover ? ' book' : ''}">${media(x)}<span class="pt">${x.tag}</span><h4>${x.name}</h4>${x.sub ? `<p class="psub">${x.sub}</p>` : ''}${x.price ? `<p class="pr">${x.price}</p>` : '<p class="pr ask">Prezzo su misura · chiedi al consulente</p>'}<p class="plead">${x.lead}</p>${x.inside ? `<p class="pin">${x.inside}</p>` : ''}${items ? `<ul>${items}</ul>` : ''}${x.items.length > 5 ? `<button class="more" type="button">Vedi tutto (+${x.items.length - 5}) ↓</button>` : ''}${x.for ? `<div class="pfor"><small>Per i concorsi di</small><div>${x.for.map((f) => `<span>${f}</span>`).join('')}</div></div>` : ''}${x.claim ? `<p class="pclaim">${x.claim}</p>` : ''}${x.guarantee ? `<p class="gua">${x.guarantee}</p>` : ''}<button class="btn ${x.main ? 'btn-red' : 'btn-line'}" type="button" data-lead="${C.n}"><span class="t">Richiedi informazioni →</span></button></article>`; };
  const cards = (arr) => `<div class="pcards mcar n${arr.length}">${arr.map(card).join('')}</div>${arr.length > 1 ? '<p class="mcar-hint">Scorri</p>' : ''}`;

  document.getElementById('main').innerHTML = `
  <section class="ghero" data-theme="dark" aria-labelledby="gTitle">

      </div>
      <div class="gpatch" aria-hidden="true"><div class="rings"></div><div class="sold" data-soldier="${key}" data-lvl="${key === 'accademie' ? 'dir' : 'base'}"></div></div>
    </div>

  <section class="gnums" data-theme="dark" aria-label="Concorsi Militari Academy in numeri">

      <div class="pick" id="pick" role="tablist" aria-label="I concorsi" data-reveal>${grpHTML}</div>

      <div class="pblk" data-reveal>
        <div class="ph"><span class="no">02</span><div><h3>Le prove psicoattitudinali</h3><p>Test di personalità, questionari e colloquio: ti alleni con chi li conosce dall'interno.</p>
          <div class="feat"><span>Simulazioni del test Minnesota</span><span>Neo PI-3</span><span>Big Five</span><span>Appuntamenti individuali con psicologhe specializzate e iscritte all'albo</span></div></div></div>
        ${cards(P.psico)}
      </div>
      <div class="pblk" data-reveal>
        <div class="ph"><span class="no">03</span><div><h3>Le prove fisiche</h3><p>Schede personalizzate e un coach dedicato, con programmi in collaborazione con il Team Andrea Presti.</p></div></div>
        ${cards(P.fisiche)}
      </div>
    </div>
  </section>

  <section class="gres" data-theme="dark" aria-labelledby="rsTitle">
    <div class="wrap">
      <p class="k" data-reveal>Risultati e recensioni</p><h2 class="h2 split" id="rsTitle">Risultati veri, <em>raccontati dagli allievi.</em></h2>
      <div class="rhd" data-reveal>
        <div class="r95"><b>97%</b><p>dei nostri allievi idonei alla prima prova nel 2026.<small>Dato Concorsi Militari Academy.</small></p></div>
        <div class="rg"><small>Garanzia 100%</small><b>O superi il concorso, o ti riprepariamo gratis.</b></div>
        <div class="rt"><b>4,9/5</b><span>su Trustpilot · 350+ recensioni</span></div>
      </div>
      <div class="crev" id="crev" data-reveal></div>
      <div class="crev-foot" data-reveal><span>Recensioni di allievi CMA, da Trustpilot.</span><a href="https://it.trustpilot.com/review/centrostudioonline.eu" target="_blank" rel="noopener">Leggi tutte le recensioni →</a></div>
    </div>
  </section>

  <section class="faq sheet" data-theme="dark" aria-labelledby="fqTitle">
    <div class="wrap grid fq-side">
      <div class="qcol"><p class="k" data-reveal>Domande frequenti</p><h2 class="h2 split" id="fqTitle">${C.n}, <em>in pratica.</em></h2>
        <div class="qlist" data-reveal>
        <details class="qa" open><summary>Questi requisiti sono quelli definitivi?<i>+</i></summary><p>Sono i requisiti in breve degli ultimi bandi. Età, titoli e prove possono cambiare a ogni nuovo concorso: verifica sempre il bando ufficiale. Un consulente CMA ti aiuta a leggerlo e a capire se puoi partecipare.</p></details>
        <details class="qa"><summary>Da quale prova conviene iniziare a prepararsi?<i>+</i></summary><p>Quasi sempre dalla prova preselettiva, che è il primo filtro: con il Metodo EAGLE impari a memorizzare la banca dati e a richiamare le risposte in fretta. In parallelo si preparano le prove psicoattitudinali e, se serve, quelle fisiche.</p></details>
        <details class="qa"><summary>Posso prepararmi online?<i>+</i></summary><p>Sì. Tutto il percorso è online, in tutta Italia: incontri one to one con il tutor, aule studio, simulazioni e il supporto delle nostre psicologhe per le prove attitudinali.</p></details>
        <details class="qa"><summary>Quanto tempo serve per prepararsi?<i>+</i></summary><p>Dipende dal concorso, dal punto di partenza e dal tempo che hai ogni giorno. Il tutor costruisce un piano su misura, anche se puoi studiare poche ore al giorno.</p></details>
        </div>
      </div>
      <aside class="tutor-box cma" data-reveal>
        <svg class="tb-star" viewBox="0 0 200 200" aria-hidden="true"><path fill="#CD141F" d="M100 8 L124 76 L196 76 L138 118 L160 188 L100 146 L40 188 L62 118 L4 76 L76 76 Z"/></svg>
        <h3>Hai un'altra domanda?</h3>
        <p>Raccontaci a che punto sei: un consulente CMA ti richiama, ti aiuta a leggere il bando e a capire da dove partire.</p>
        <button class="btn btn-red magnetic" type="button" data-lead="${C.n}"><span class="t">Parla con un consulente →</span></button>
        <a class="tutor-link" href="test-concorsi.html#inizia">Oppure fai il Test Concorsi →</a>
        <small>Gratuito · senza impegno</small>
      </aside>
    </div>
  </section>`;
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/lambda.js?v=44"></script>
<script>
gsap.set('#logo', { autoAlpha: 1 });
(() => {
  const L = window.Lambda, $ = (s) => document.querySelector(s);
  if (!window.__CORPO) return;
  const { C, list } = window.__CORPO;
  const LVN = { dir: 'Ufficiali', medio: 'Marescialli · Ispettori', base: 'Truppa · Agenti', scuole: 'Scuole militari' };
  const LVD = { dir: 'Il ruolo direttivo: comando, pianificazione e alta responsabilità. I concorsi più selettivi.', medio: 'Il comando intermedio: coordinamento operativo e responsabilità tecniche.', base: 'La porta d\'ingresso: il ruolo iniziale, da cui parte la carriera.', scuole: 'Formazione liceale e militare, il primo passo verso l\'accademia.' };
  const SERV = { smart: ['Prima prova', 'Preparazione Concorsi SMART', 'Banca dati, memoria e simulazioni per superare la prova preselettiva.'], memory: ['Prova preselettiva', 'Memory Express', 'Tecniche di memoria per la banca dati della prova preselettiva.'], psico: ['Prove attitudinali', 'Percorso Psicoattitudinale', 'Con le nostre psicologhe: test di personalità, autobiografico e colloquio.'], fisiche: ['Prove fisiche', 'Preparazione prove fisiche', 'Allenamento mirato per le prove di efficienza fisica.'] };
  const IC = { eta: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2', tit: 'M3 9l9-5 9 5-9 5zM7 11v5c3 2 7 2 10 0v-5', fed: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4', ido: 'M4 12h4l2-5 4 10 2-5h4', alt: 'M5 12h14M12 5v14' };
  const rq = (ic, label, main, sub = '', wide = false) => `<div class="rq${wide ? ' wide' : ''}"><small><svg viewBox="0 0 24 24"><path d="${IC[ic]}"/></svg>${label}</small><b>${main}</b>${sub ? `<span>${sub}</span>` : ''}</div>`;
  const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';

  /* ---------- il fascicolo tecnico: bando, requisiti, prove, documenti, iter ---------- */
  const DET = window.CMA_DETTAGLI || {};
  function fascicolo(x) {
    const d = DET[x.k]; if (!d || !d.length) return '';
    return `<div class="fasc" data-fasc="${x.k}">
      <div class="fasc-hd"><div><small>Fascicolo tecnico · dalla Libretta CMA</small><h3 style="margin-top:10px">Tutto il concorso, nel dettaglio</h3><p>Posti, scadenze, esclusioni, come si svolge ogni prova e cosa portare il giorno del concorso.</p></div></div>
      <div class="ftabs" role="tablist">${d.map((s, i) => `<button type="button" role="tab" aria-selected="${!i}" data-f="${i}"><i>${String(i + 1).padStart(2, '0')}</i>${s.t}</button>`).join('')}</div>
      <div class="fpanel"><span class="stamp">ULTIMO BANDO</span><div class="fbody" role="tabpanel"></div></div>
      <button type="button" class="fmore">Leggi tutto <span aria-hidden="true">↓</span></button>
    </div>`;
  }
  function fascBind(root) {
    const f = root.querySelector('.fasc'); if (!f) return;
    const d = DET[f.dataset.fasc], body = f.querySelector('.fbody'), more = f.querySelector('.fmore');
    const show = (i) => {
      f.querySelectorAll('[data-f]').forEach((b) => b.setAttribute('aria-selected', String(+b.dataset.f === i)));
      body.classList.remove('open'); body.innerHTML = d[i].h;
      // ogni titolo (o etichetta) apre un blocco: così titolo ed elenco restano insieme
      const blks = []; [...body.children].forEach((el) => { const last = blks[blks.length - 1]; if (!last || el.matches('h5') && last.children.length || el.matches('p.lb') && last.querySelector('ul')) blks.push(document.createElement('div')); blks[blks.length - 1].appendChild(el); });
      blks.forEach((b) => { b.className = 'fblk'; body.appendChild(b); });
      more.hidden = body.scrollHeight <= body.clientHeight + 8;
      if (!L.reduced) gsap.from(body.children, { y: 10, opacity: 0, duration: 0.45, stagger: 0.02, ease: 'power2.out' });
    };
    f.querySelector('.ftabs').addEventListener('click', (e) => { const b = e.target.closest('[data-f]'); if (b) show(+b.dataset.f); });
    more.addEventListener('click', () => { body.classList.add('open'); more.hidden = true; L.lenis && L.lenis.resize && L.lenis.resize(); });
    show(0);
  }

  /* ---------- la scheda di un concorso ---------- */
  function scheda(x) {
    const r = x.req, sec = $('#schedaMain');
    const eta = r.eta.length ? rq('eta', 'Età', cap(r.eta[0]), r.eta.slice(1).join(' · ')) : '';
    const tit = r.titolo.length ? rq('tit', 'Titolo di studio', cap(r.titolo[0]), r.titolo.slice(1).join(' · ')) : '';
    const fed = r.fedina ? rq('fed', 'Fedina penale', cap(r.fedina)) : '';
    const ido = r.idoneita ? rq('ido', 'Idoneità', cap(r.idoneita)) : '';
    const alt = r.altri.map((a) => rq('alt', a.l, cap(a.v[0] || ''), a.v.slice(1).join(' · '), a.v.length > 2)).join('');
    sec.innerHTML = `<div>
      <div class="ctitle"><div><p class="k">Scheda concorso · ${LVN[x.lvl]}</p><h2 style="margin-top:12px">${x.title}</h2><p>${x.what}</p></div><span class="lvlb">${LVN[x.lvl]}</span></div>
      <div class="reqs">${eta}${tit}${fed}${ido}${alt}</div>
      <div class="route"><h3>Le fasi del concorso</h3><div class="steps">${x.prove.map((p, i) => `<div class="stp"><i>${String(i + 1).padStart(2, '0')}</i><b>${p.t}</b>${p.d.length ? `<span>${p.d.join(' · ')}</span>` : ''}</div>`).join('')}</div></div>
      ${x.nota ? `<div class="warn"><b>ATTENZIONE</b><span>${x.nota}</span></div>` : ''}
      ${fascicolo(x)}
      <p class="disc">Requisiti, prove e date sono tratti dagli ultimi bandi: possono cambiare a ogni concorso, verifica sempre il bando ufficiale. <a href="test-concorsi.html#inizia">Verifica la tua compatibilità →</a></p>
    </div>`;
    fascBind(sec);
    if (!L.reduced) gsap.from(sec.querySelectorAll('.ctitle, .rq, .stp, .warn'), { y: 18, opacity: 0, duration: 0.6, stagger: 0.035, ease: 'power3.out' });
  }

  /* ---------- scelta del concorso (al posto della piramide) ---------- */
  const pick = $('#pick');
  // il concorso VFI non ha la prova preselettiva: si nasconde il blocco dei percorsi dedicati e si rinumerano gli altri
  const prePerc = (x) => { const pre = document.getElementById('pPre'); if (!pre) return; pre.hidden = /^vfi-/.test(x.k);
    [...document.querySelectorAll('#percorsi .pblk')].filter((b) => !b.hidden).forEach((b, i) => { const n = b.querySelector('.no'); if (n) n.textContent = String(i + 1).padStart(2, '0'); }); };
  const select = (x) => { pick.querySelectorAll('[data-k]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.k === x.k))); scheda(x); cur = x; dos(dsel); prePerc(x); };
  pick.addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) select(list.find((x) => x.k === b.dataset.k)); });

  /* ---------- il dossier del corpo (box di lato: diventerà una motion graphic) ---------- */
  let cur = null, dsel = 0;
  const strip = (h) => h.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  function bando(x) {
    const d = (DET[x.k] || []).find((s) => s.k === 'bando'); if (!d) return null;
    const t = strip(d.h), posti = (t.match(/Posti disponibili:?\s*([\d.]+)/i) || t.match(/per\s+([\d.]+)\s+(?:posti|Allievi|allievi)/))?.[1];
    const dom = (t.match(/(?:Presentazione domande|domande)[^.]*?(dal[^.;]*?\d{4})/i) || [])[1];
    return { posti, dom, first: strip(d.h.split('</p>')[0]) };
  }
  function dos(i) {
    dsel = i; document.querySelectorAll('.dtabs2 button').forEach((b) => b.setAttribute('aria-selected', String(+b.dataset.d === i)));
    const body = $('#dbody');
    if (i === 0) body.innerHTML = `<p>${C.what}</p><div class="chips2">${C.roles.map((r) => `<span>${r}</span>`).join('')}</div>`;
    if (i === 1) body.innerHTML = `<p>Fa per te se ti riconosci in questo: <b style="color:var(--bone)">${C.tag.toLowerCase()}</b>.</p><div class="chips2">${C.env.map((e) => `<span>${e}</span>`).join('')}</div><p class="dfoot">Non sei sicuro? In tre minuti il Test Concorsi incrocia età, titolo e preferenze.</p>`;
    if (i === 2) { const b = cur && bando(cur); body.innerHTML = b ? `<dl><dt>Concorso</dt><dd>${cur.title}</dd>${b.posti ? `<dt>Posti</dt><dd>${b.posti}</dd>` : ''}${b.dom ? `<dt>Domande</dt><dd>${b.dom.replace(/^dal/i, 'Dal')}</dd>` : ''}<dt>Fasi</dt><dd>${cur.prove.length}</dd></dl><p class="dfoot">Dati dell'ultimo bando: verifica sempre il bando ufficiale.</p>` : `<p>I dati dell'ultimo bando di questo concorso sono in aggiornamento.</p>`; }
    if (!L.reduced) gsap.from(body.children, { y: 10, opacity: 0, duration: 0.4, stagger: 0.04, ease: 'power2.out' });
  }
  document.querySelector('.dtabs2').addEventListener('click', (e) => { const b = e.target.closest('[data-d]'); if (b) dos(+b.dataset.d); });

  // si parte dal ruolo iniziale, oppure dal concorso arrivando da una card della home (?k=concorso)
  const want = list.find((x) => x.k === new URLSearchParams(location.search).get('k'));
  const firstL = ['base', 'medio', 'dir', 'scuole'].find((l) => list.some((x) => x.lvl === l));
  if (list.length) select(want || list.find((x) => x.lvl === firstL));
  if (want) setTimeout(() => { const el = $('#scheda'); L.lenis ? L.lenis.scrollTo(el, { offset: -40, duration: 1.4 }) : el.scrollIntoView({ behavior: 'smooth' }); }, 700);

  /* ---------- percorsi: "vedi tutto" sulle card lunghe ---------- */
  document.querySelectorAll('.pc .more').forEach((b) => b.addEventListener('click', () => { const pc = b.closest('.pc'); pc.classList.add('open'); b.remove(); L.lenis?.resize?.(); }));

  /* ---------- recensioni: prima quelle di questo corpo ---------- */
  const R = window.CMA_REVIEWS || [], CO = window.CMA_CORPI, STARS = '<div class="stars"><i></i><i></i><i></i><i></i><i></i></div>';
  const mine = R.filter((r) => r.corpo === C.k || (C.k === 'accademie' && /Accademi|Ufficiali/i.test(r.tag)));
  const revs = [...mine, ...R.filter((r) => !mine.includes(r))].slice(0, 6);
  $('#crev').innerHTML = revs.map((r) => { const c = r.corpo && CO.find((x) => x.k === r.corpo); return `<figure class="crv" style="${c ? `--c:${c.color}` : ''}">${STARS}<q>${r.q}</q><span class="tg">${r.tag}</span><figcaption class="who"><b>${r.n}</b> · ${c ? c.n + ', ' : ''}su Trustpilot</figcaption></figure>`; }).join('');
  window.Lambda?.stars(document.getElementById('crev'));
})();
</script>
